<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>光与水的孩子 · 生态观察舱</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/sense.css">
</head>
<body>

<!-- Shared SVG paint servers and filters. Kept renderable (0×0, not display:none) so url(#…) resolves.
     The refraction filters of the liquid glass are added here at start-up (glass.js). -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- The two sense filters run once, on small canvases (see sense.js), so their
         lengths are in canvas pixels: about a third of a stage pixel for the field,
         half for the body. -->

    <!-- Lutie's light field: no lens, only brightness. Blur → luminance → banded palette. -->
    <filter id="fx-lightfield" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
      <feColorMatrix type="matrix" values="
        .36 .70 .14 0 -.07
        .36 .70 .14 0 -.07
        .36 .70 .14 0 -.07
        0   0   0   1  0"/>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues=".012 .020 .035 .060 .110 .240 .520 .860"/>
        <feFuncG type="discrete" tableValues=".030 .062 .118 .200 .330 .520 .780 .960"/>
        <feFuncB type="discrete" tableValues=".075 .135 .215 .310 .430 .580 .790 .940"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation=".9"/>
    </filter>

    <!-- Her own body as she feels it: a soft outline with a bright core, no surface detail. -->
    <filter id="fx-self" x="-25%" y="-12%" width="150%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="soft"/>
      <feFlood flood-color="#7ef5dc" flood-opacity=".58"/>
      <feComposite in2="soft" operator="in" result="body"/>
      <!-- Blurred far enough that no face survives; brightness alone decides the core. -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blurred"/>
      <feColorMatrix in="blurred" type="matrix" values="
        0 0 0 0 .94
        0 0 0 0 1
        0 0 0 0 .97
        .6 1.1 .5 0 -1.42" result="bright"/>
      <feComposite in="bright" in2="blurred" operator="in" result="core"/>
      <feMerge><feMergeNode in="body"/><feMergeNode in="core"/></feMerge>
    </filter>

    <radialGradient id="g-sun">
      <stop offset="0"   stop-color="#fffdf4"/>
      <stop offset=".5"  stop-color="#ffe2a4"/>
      <stop offset="1"   stop-color="#ffb85a"/>
    </radialGradient>
    <radialGradient id="g-sun-halo">
      <stop offset="0"   stop-color="#ffd692" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffbf70" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#ffbf70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-liquid" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#d2fff6" stop-opacity=".78"/>
      <stop offset=".45" stop-color="#6ff0e0" stop-opacity=".56"/>
      <stop offset="1"   stop-color="#57d8ff" stop-opacity=".4"/>
    </linearGradient>
  </defs>
</svg>

<!--
  Depth, back to front:
    the room → Lutie in the water → the pane, with what is printed on it →
    the pod's hull, close and dark → the instruments, floating nearest the eye
-->
<main id="stage" class="stage" data-view="human" data-mood="calm">

  <!-- ─────────── World as the researcher sees it ─────────── -->
  <div class="world world--human">
    <div class="scene" data-depth="-16">
      <img class="scene__bg" src="../references/game-hud/Koma-1-v1%20(1).png" alt="" draggable="false">
    </div>
    <div class="rays" aria-hidden="true">
      <i style="--x:14%;--w:9%;--k:-9deg;--d:11s;--o:-2s"></i>
      <i style="--x:31%;--w:6%;--k:-5deg;--d:14s;--o:-7s"></i>
      <i style="--x:46%;--w:11%;--k:0deg;--d:12s;--o:-4s"></i>
      <i style="--x:63%;--w:6%;--k:5deg;--d:15s;--o:-9s"></i>
      <i style="--x:78%;--w:9%;--k:9deg;--d:10s;--o:-1s"></i>
    </div>
    <div class="lutie" data-depth="-6">
      <div class="lutie__aura"></div>
      <div class="lutie__float">
        <img class="lutie__sprite" src="../references/game-hud/nai-diffusion-5-full-1036129100.png" alt="露缇" draggable="false">
      </div>
      <div class="lutie__pool"><i></i><i></i></div>
    </div>
    <canvas class="caustics" aria-hidden="true"></canvas>
    <canvas class="motes" aria-hidden="true"></canvas>
    <div class="offerings" aria-hidden="true"></div>
  </div>

  <!-- ─────────── World as Lutie senses it ─────────── -->
  <div class="world world--sense" aria-hidden="true">
    <div class="sense__field" data-depth="-16"><canvas id="senseField"></canvas></div>
    <div class="sense__aura"></div>
    <div class="sense__self" data-depth="-6"><canvas id="senseSelf"></canvas></div>
    <canvas class="sense__flow"></canvas>
    <svg class="sense__pulse" viewBox="-400 -400 800 800">
      <circle r="60" style="--i:0"/><circle r="60" style="--i:1"/>
      <circle r="60" style="--i:2"/><circle r="60" style="--i:3"/>
    </svg>
    <div class="sense__observer">
      <svg viewBox="-100 -100 200 200"><circle r="26" style="--i:0"/><circle r="26" style="--i:1"/></svg>
    </div>
  </div>

  <!-- ─────────── The pane of glass between ─────────── -->
  <div class="pane" aria-hidden="true">
    <div class="pane__vignette"></div>
    <div class="pane__sheen"></div>
    <div class="pane__raster"></div>
    <div class="pane__scan"></div>
  </div>
  <div class="bevel" aria-hidden="true"></div>
  <div class="taps" aria-hidden="true"></div>

  <!-- Printed on the inside of the pane: marks that curve with it and frame nothing.
       The humidity scale runs down the left edge of the port and turns into the
       rule under the subject's name. Drawn by hud.js from the port's own outline. -->
  <div class="imprint">
    <svg id="etch" class="etch" aria-hidden="true" focusable="false"></svg>
    <section class="plate" id="plate" aria-label="Subject">
      <svg class="plate__mark" viewBox="0 0 46 52" aria-hidden="true">
        <path d="M5 22 C5 10 13 4 23 4 C33 4 41 10 41 22 C37.8 20 34.9 20 31.8 22 C28.9 20 25.9 20 23 22 C20.1 20 17.1 20 14.2 22 C11.1 20 8.2 20 5 22 Z"/>
        <path d="M11 25 C8.6 31 13.4 35 11 42 M19 25.5 C17 33 21 38 19 48 M27 25.5 C29 33 25 38 27 48 M35 25 C37.4 31 32.6 35 35 42"/>
        <path class="plate__canal" d="M23 8.5 V17.5 M15.6 11 L18.2 18 M30.4 11 L27.8 18"/>
      </svg>
      <div class="plate__text" data-human>
        <strong>LUTIE</strong>
        <span>AQUATIC LIFE STUDY</span>
        <span>SPECIES : UMBRAGEL (MIMIC)</span>
      </div>
    </section>
  </div>

  <!-- ─────────── The pod ─────────── -->
  <canvas id="hull" class="hull" aria-hidden="true"></canvas>
  <div id="lamps" class="lamps" aria-hidden="true"></div>

  <!-- ─────────── Instruments ─────────── -->
  <div class="hud">

    <!-- Vesicles: liquid gathered in the corners of the port, each one body holding several organs. -->
    <div class="hud__layer" data-depth="5">

      <!-- Life support: temperature, the hydration vein, the ether dial -->
      <section class="w w-env glass" data-glass="env" aria-label="Environment">
        <div class="w-env__temp" data-human>
          <svg class="ico-drop" viewBox="0 0 16 20" aria-hidden="true">
            <path d="M8 1.6 C8 1.6 2.6 8.6 2.6 12.7 a5.4 5.4 0 0 0 10.8 0 C13.4 8.6 8 1.6 8 1.6 Z"/>
            <path class="ico-drop__glint" d="M5.5 12.9 a2.7 2.7 0 0 0 1.9 2.5"/>
          </svg>
          <output class="num" id="temp">20.0</output><span class="unit">°C</span>
        </div>

        <!-- Hydration: a channel of her water, rendered as a solid (liquid.js) -->
        <div class="vein" aria-label="Hydration">
          <canvas class="vein__liquid" id="veinLiquid" aria-hidden="true"></canvas>
        </div>

        <!-- Two beads of air adrift in the drop -->
        <i class="organelle" style="--x:246px;--y:108px;--s:11px;--d:-1s" data-human></i>
        <i class="organelle" style="--x:84px;--y:84px;--s:7px;--d:-4s" data-human></i>

        <!-- The ether dial: a small sun. The arc is the setting; the bright body
             at its end is the handle. -->
        <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Ether light" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
          <svg viewBox="0 0 112 112" aria-hidden="true">
            <circle class="dial__halo" cx="56" cy="56" r="42" fill="url(#g-sun-halo)"/>
            <circle class="dial__track" cx="56" cy="56" r="42" pathLength="100" transform="rotate(135 56 56)"/>
            <circle class="dial__value" id="dialValue" cx="56" cy="56" r="42" pathLength="100" transform="rotate(135 56 56)"/>
            <g class="dial__orbit">
              <circle cx="56" cy="56" r="29"/>
              <circle class="dial__moon" cx="85" cy="56" r="2.4"/>
              <circle class="dial__moon" cx="41.5" cy="30.9" r="1.5"/>
            </g>
            <circle class="dial__ring" cx="56" cy="56" r="17"/>
            <circle class="dial__core" cx="56" cy="56" r="9" fill="url(#g-sun)"/>
            <circle class="dial__knob" id="dialKnob" r="5.2"/>
          </svg>
        </div>
      </section>

      <!-- Life cycle -->
      <section class="w w-cycle glass" data-glass="cycle" aria-label="Life cycle">
        <div class="w-cycle__head" data-human>
          <span class="label">CYCLE</span>
          <span class="num">04</span><span class="den">/08</span>
          <span class="w-cycle__stage" id="cycleStage">SAPIENT</span>
        </div>
        <ol class="w-cycle__track" id="cycleTrack"></ol>
      </section>
    </div>

    <!-- What the hand reaches for: nearest the eye, and the only things that stand proud. -->
    <div class="hud__layer" data-depth="9">

      <!-- Care actions -->
      <nav class="w-actions" aria-label="Care">
        <button class="w bubble bubble--water glass" type="button" data-action="water" data-glass="bubbleWater">
          <svg class="bubble__icon" viewBox="0 0 40 40" aria-hidden="true" data-human>
            <path d="M9 14 q3.67 -3.4 7.33 0 t7.33 0 t7.33 0 M9 20.5 q3.67 -3.4 7.33 0 t7.33 0 t7.33 0 M9 27 q3.67 -3.4 7.33 0 t7.33 0 t7.33 0"/>
          </svg>
          <span class="bubble__label" data-human>WATER</span>
        </button>
        <button class="w bubble bubble--light glass" type="button" data-action="light" data-glass="bubbleLight">
          <svg class="bubble__icon" viewBox="0 0 40 40" aria-hidden="true" data-human>
            <circle class="fill" cx="18" cy="22" r="3.6"/>
            <g class="fill">
              <circle cx="27" cy="22" r="1.15"/><circle cx="24.36" cy="28.36" r="1.15"/><circle cx="18" cy="31" r="1.15"/><circle cx="11.64" cy="28.36" r="1.15"/>
              <circle cx="9" cy="22" r="1.15"/><circle cx="11.64" cy="15.64" r="1.15"/><circle cx="18" cy="13" r="1.15"/><circle cx="24.36" cy="15.64" r="1.15"/>
            </g>
            <path class="fill" d="M29.5 5.5 q.55 3.95 4.5 4.5 q-3.95 .55 -4.5 4.5 q-.55 -3.95 -4.5 -4.5 q3.95 -.55 4.5 -4.5 Z"/>
          </svg>
          <span class="bubble__label" data-human>LIGHT</span>
        </button>
        <button class="w bubble bubble--feed glass" type="button" data-action="feed" data-glass="bubbleFeed">
          <svg class="bubble__icon" viewBox="0 0 40 40" aria-hidden="true" data-human>
            <path d="M14 14.4 q6 -2 12 0 L31 27 q-2.75 2.6 -5.5 0 q-2.75 2.6 -5.5 0 q-2.75 2.6 -5.5 0 q-2.75 2.6 -5.5 0 Z"/>
            <path d="M18 13.5 L14.5 27 M20 13.2 V27 M22 13.5 L25.5 27"/>
          </svg>
          <span class="bubble__label" data-human>FEED</span>
        </button>
      </nav>

      <!-- Sense switch: the crystal in its lens -->
      <button class="w w-view glass" type="button" id="viewSwitch" data-glass="view" aria-label="Switch view" aria-pressed="false">
        <svg class="w-view__dial" viewBox="0 0 276 254" aria-hidden="true">
          <path class="view__ticks" d="M53.2 163.2 A103 103 0 0 1 135.7 26"/>
          <g class="view__orbit">
            <ellipse cx="150" cy="128" rx="104" ry="56"/>
            <circle cx="52.3" cy="108.8" r="2.6"/>
            <circle cx="247.7" cy="147.2" r="2.6"/>
            <circle cx="90.3" cy="173.9" r="2"/>
          </g>
          <path class="view__chev" d="M54 119 l-9 9 l9 9 M246 119 l9 9 l-9 9"/>
          <g class="view__ether"><circle cx="220.9" cy="206.8" r="5.4"/><circle class="fill" cx="220.9" cy="206.8" r="1.8"/></g>
        </svg>
        <i class="w-view__halo" aria-hidden="true"></i>
        <!-- The stone itself is a ray-traced solid (crystal.js). The SVG after it
             stays empty unless WebGL is missing, when gem.js draws a flat stand-in. -->
        <canvas class="w-view__crystal" id="crystal" aria-hidden="true"></canvas>
        <svg class="w-view__gem" id="gem" viewBox="0 0 276 254" aria-hidden="true"></svg>
        <span class="w-view__label"><b>VIEW</b><i id="viewName">HUMAN</i></span>
      </button>

      <!-- Speech -->
      <section class="w w-dialog glass" id="dialog" data-glass="dialog" aria-label="Lutie">
        <div class="w-dialog__tag glass" data-glass="nameTag">
          <svg class="w-dialog__drop" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 2 C8 2 2.8 8.8 2.8 12.8 a5.2 5.2 0 0 0 10.4 0 C13.2 8.8 8 2 8 2 Z"/><circle cx="8" cy="13" r="2.5"/></svg>
          <span class="label" data-human>LUTIE</span>
        </div>
        <p class="w-dialog__line" id="line" aria-live="polite" data-human></p>
        <div class="w-dialog__glyphs" aria-hidden="true" data-sense>
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <svg class="w-dialog__next" viewBox="0 0 16 16" aria-hidden="true" data-human>
          <path d="M8 0 q1 7 8 8 q-7 1 -8 8 q-1 -7 -8 -8 q7 -1 8 -8 Z"/>
        </svg>
      </section>
    </div>
  </div>

  <div class="curtain" aria-hidden="true"></div>
</main>

<script src="js/core.js"></script>
<script src="js/geometry.js"></script>
<script src="js/frame.js"></script>
<script src="js/blob.js"></script>
<script src="js/shapes.js"></script>
<script src="js/glass.js"></script>
<script src="js/gem.js"></script>
<script src="js/crystal.js"></script>
<script src="js/liquid.js"></script>
<script src="js/water.js"></script>
<script src="js/sense.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
